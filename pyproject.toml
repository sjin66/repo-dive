[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "repo-dive"
version = "0.1.0"
description = "Agent-friendly local repository evidence CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "repo-dive contributors" }]
dependencies = [
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
]

[project.optional-dependencies]
vector = [
  "sentence-transformers>=6.0,<7.0",
]
dev = [
  "build>=1.2,<2.0",
  "mypy>=1.14",
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
repo-dive = "repo_dive.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_dive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]
